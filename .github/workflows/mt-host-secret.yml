name: MT host secret to Pages
# Copies the repo secrets MT_HOST_SECRET + MT_PUBLISH_KEY (made on our MT host server by tools/mthost/install-qtunnel.sh
# --new-secret, piped into `gh secret set`, never printed) into the Pages production env with wrangler, and optionally starts the
# normal site deploy so they take effect (Pages env applies only to new deployments). deploy-site.yml also syncs both on every
# deploy of main, so this is only for a rotation between deploys. By hand only (workflow_dispatch runs the file from main; no push
# trigger, so a branch cannot edit this file and read the secrets). Prints no secret.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also start the site deploy of main now (Pages env applies only to new deployments)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: write   # start deploy-site.yml on main
jobs:
  secret:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set MT_HOST_SECRET + MT_PUBLISH_KEY in Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MT_HOST_SECRET: ${{ secrets.MT_HOST_SECRET }}
          MT_PUBLISH_KEY: ${{ secrets.MT_PUBLISH_KEY }}
        run: |
          set -euo pipefail
          [ "${#MT_HOST_SECRET}" -ge 32 ] && [ "${#MT_PUBLISH_KEY}" -ge 32 ] || { echo "::error::repo secret MT_HOST_SECRET or MT_PUBLISH_KEY missing or short"; exit 1; }
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{35,}' | tail -1 || true)
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-f]{32}' | head -1 || true)
          echo "::add-mask::$TOKEN"; echo "::add-mask::$ACCOUNT"
          PROJ=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects" | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('result') or [];import re;print(next((p['name'] for p in r if any(re.search('strykertrading|tradezoro',x,re.I) for x in p.get('domains') or [])), ''))")
          [ -n "$PROJ" ] || { echo "::error::Pages project not found"; exit 1; }
          for n in MT_HOST_SECRET MT_PUBLISH_KEY; do
            printf '%s' "${!n}" | CLOUDFLARE_API_TOKEN=$TOKEN CLOUDFLARE_ACCOUNT_ID=$ACCOUNT npx --yes wrangler@4.138.0 pages secret put "$n" --project-name "$PROJ" >/dev/null
            echo "$n set on Pages project $PROJ"
          done
      - name: Start the site deploy
        if: ${{ inputs.deploy == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml -R "$GITHUB_REPOSITORY" --ref main && echo "deploy-site started on main"
